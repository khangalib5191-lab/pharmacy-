<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Linear Gradients for Futuristic Cyan to Royal Blue Circuit Look -->
    <linearGradient id="newaraBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="newaraCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="newaraBrightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- ICON EMBLEM "N" WITH CIRCUIT TECH TRACES -->
  <g transform="translate(40, 30)">
    <!-- 1. Left Vertical Pillar with Circuit Notch -->
    <path d="M 90,60 L 125,40 L 125,250 L 90,250 Z" fill="url(#newaraBlueGrad)" />
    
    <!-- Left vertical accent thin strip -->
    <path d="M 135,110 L 150,110 L 150,250 L 135,250 Z" fill="url(#newaraCyanGrad)" />

    <!-- 2. Diagonal Circuit Bridge -->
    <path d="M 125,40 L 155,40 L 260,200 L 230,200 Z" fill="url(#newaraBrightGrad)" />

    <!-- Parallel Diagonal Circuit Lines with Nodes -->
    <line x1="150" y1="75" x2="245" y2="218" stroke="url(#newaraCyanGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="75" r="5" fill="#38bdf8"/>
    <circle cx="197" cy="146" r="4.5" fill="#38bdf8"/>
    <circle cx="245" cy="218" r="5" fill="#06b6d4"/>

    <line x1="175" y1="80" x2="260" y2="207" stroke="url(#newaraCyanGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="175" cy="80" r="4.5" fill="#38bdf8"/>
    <circle cx="260" cy="207" r="4.5" fill="#06b6d4"/>

    <!-- 3. Right Vertical & Concentric Wave Circles -->
    <!-- Right vertical trace -->
    <path d="M 270,140 L 290,140 L 290,250 L 270,250 Z" fill="url(#newaraCyanGrad)" />
    
    <!-- Concentric Signal Waves / Tech Rings (Top Right of N) -->
    <!-- Outer Arc -->
    <path d="M 215,105 A 55,55 0 0,1 325,105" fill="none" stroke="url(#newaraCyanGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="215" cy="105" r="5" fill="#38bdf8"/>
    <circle cx="325" cy="105" r="5" fill="#06b6d4"/>

    <!-- Middle Arc -->
    <path d="M 233,105 A 37,37 0 0,1 307,105" fill="none" stroke="url(#newaraCyanGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="233" cy="105" r="4.5" fill="#38bdf8"/>
    <circle cx="307" cy="105" r="4.5" fill="#06b6d4"/>

    <!-- Inner Core Loop -->
    <path d="M 252,105 A 18,18 0 0,1 288,105 L 288,170" fill="none" stroke="url(#newaraCyanGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="252" cy="105" r="4" fill="#38bdf8"/>
    <circle cx="288" cy="170" r="4" fill="#0284c7"/>

    <!-- Lower connection trace -->
    <path d="M 230,200 L 270,250 L 305,250 L 260,195 Z" fill="url(#newaraBlueGrad)"/>
  </g>

  <!-- TYPOGRAPHY: "NEWARA" -->
  <text x="250" y="360" text-anchor="middle" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="62" letter-spacing="4" fill="url(#newaraBrightGrad)">
    NEWARA
  </text>

  <!-- TYPOGRAPHY: "SOFTWARE COMPANY" -->
  <text x="250" y="405" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="20" letter-spacing="9" fill="url(#newaraCyanGrad)">
    SOFTWARE COMPANY
  </text>
</svg>
